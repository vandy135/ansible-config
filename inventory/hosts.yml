---
# =============================================================================
# ANSIBLE INVENTORY FILE
# =============================================================================
# Defines hosts and groups for the playbook.
#
# Reference: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
# =============================================================================

all:
  children:
    # -------------------------------------------------------------------------
    # WORKSTATIONS GROUP
    # -------------------------------------------------------------------------
    # Personal machines (laptops and desktops)
    workstations:
      children:
        laptops:
          hosts:
            laptop:
              ansible_host: 192.168.1.100
              # For local execution, use:
              # ansible_connection: local

        desktops:
          hosts:
            desktop:
              ansible_host: 192.168.1.101
              # For local execution, use:
              # ansible_connection: local

    # -------------------------------------------------------------------------
    # SERVERS GROUP (Example - for future expansion)
    # -------------------------------------------------------------------------
    servers:
      hosts:
        # Example server entry:
        # homelab:
        #   ansible_host: 192.168.1.200
        #   ansible_user: admin

    # -------------------------------------------------------------------------
    # LOCAL GROUP
    # -------------------------------------------------------------------------
    # For running playbook on the local machine
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

# =============================================================================
# USAGE EXAMPLES
# =============================================================================
# Run on specific host:
#   ansible-playbook site.yml -l laptop
#   ansible-playbook site.yml -l desktop
#
# Run on all workstations:
#   ansible-playbook site.yml -l workstations
#
# Run on all laptops:
#   ansible-playbook site.yml -l laptops
#
# Run locally:
#   ansible-playbook site.yml -l localhost
#
# Dry run (check mode):
#   ansible-playbook site.yml -l laptop --check --diff
# =============================================================================
