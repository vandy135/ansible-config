[defaults]
# Inventory file location
# Reference: https://docs.ansible.com/ansible/latest/inventory_guide/intro_inventory.html
inventory = inventory/hosts.yml

# Roles path
roles_path = roles

# Disable host key checking for initial setup (enable in production)
host_key_checking = False

# SSH connection settings
remote_user = root
private_key_file = ~/.ssh/id_ed25519

# Retry files are not needed with version control
retry_files_enabled = False

# Display callback - yaml format for readability
stdout_callback = yaml
callback_whitelist = profile_tasks

# Gather only necessary facts for performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Parallel execution - increase for multiple hosts
forks = 10

# Pipelining improves performance by reducing SSH operations
# Requires requiretty to be disabled in sudoers
pipelining = True

# Vault password file (optional - create this file with your vault password)
# vault_password_file = .vault_password

[privilege_escalation]
# Default privilege escalation settings
# Reference: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_privilege_escalation.html
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH arguments for performance and reliability
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = /tmp/ansible-%%h-%%p-%%r

[diff]
# Always show diffs when using --check or --diff
always = False
context = 3
