---
# =============================================================================
# BASE ROLE - DEFAULT VARIABLES
# =============================================================================
# These defaults can be overridden in group_vars or host_vars.
# Reference: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html#role-default-variables
# =============================================================================

# Pacman configuration
pacman_parallel_downloads: 5
pacman_color: true
pacman_verbose_pkg_lists: true
pacman_check_space: true

# Mirror configuration
pacman_mirror_countries:
  - United States

# Base development packages
base_devel_packages:
  - base-devel
  - git
  - wget
  - rsync

# System configuration
system_timezone: America/Chicago
system_locale: en_US.UTF-8
system_keymap: us
system_hostname: archlinux

# Feature flags for this role
configure_pacman: true
install_base_devel: true
