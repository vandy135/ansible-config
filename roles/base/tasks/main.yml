---
# =============================================================================
# BASE ROLE - MAIN TASKS
# =============================================================================
# Entry point for base system configuration tasks.
# Reference: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html
# =============================================================================

- name: Include pre-flight checks
  ansible.builtin.include_tasks: preflight.yml
  tags:
    - base
    - preflight
    - always

- name: Configure pacman
  ansible.builtin.include_tasks: pacman.yml
  when: configure_pacman | default(true)
  tags:
    - base
    - pacman

- name: Configure system locale and timezone
  ansible.builtin.include_tasks: locale.yml
  tags:
    - base
    - locale

- name: Install base development packages
  ansible.builtin.include_tasks: base-devel.yml
  when: install_base_devel | default(true)
  tags:
    - base
    - base-devel
