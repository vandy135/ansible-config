---
# =============================================================================
# BASE ROLE - PRE-FLIGHT CHECKS
# =============================================================================
# Validates system requirements before proceeding with configuration.
# Reference: https://docs.ansible.com/ansible/latest/collections/ansible/builtin/assert_module.html
# =============================================================================

- name: Verify running on Arch Linux
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Archlinux"
    fail_msg: "This playbook is designed for Arch Linux only. Detected: {{ ansible_distribution }}"
    success_msg: "Verified: Running on Arch Linux"
  tags:
    - preflight

- name: Verify root or sudo access
  ansible.builtin.command: whoami
  register: current_user
  changed_when: false
  failed_when: false
  tags:
    - preflight

- name: Check if running as root or can become root
  ansible.builtin.assert:
    that:
      - current_user.stdout == 'root' or ansible_become | default(false)
    fail_msg: "Must run as root or with become privileges"
    success_msg: "Verified: Sufficient privileges available"
  when: not ansible_check_mode
  tags:
    - preflight

- name: Check internet connectivity
  ansible.builtin.uri:
    url: https://archlinux.org
    method: HEAD
    timeout: 10
  register: internet_check
  failed_when: false
  changed_when: false
  tags:
    - preflight

- name: Warn if no internet connection
  ansible.builtin.debug:
    msg: "WARNING: No internet connection detected. Package installation will fail."
  when: internet_check.status is not defined or internet_check.status != 200
  tags:
    - preflight

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: pacman
  tags:
    - preflight

- name: Display system information
  ansible.builtin.debug:
    msg: |
      System Information:
      - Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}
      - Kernel: {{ ansible_kernel }}
      - Architecture: {{ ansible_architecture }}
      - Hostname: {{ ansible_hostname }}
      - Python: {{ ansible_python_version }}
  tags:
    - preflight
